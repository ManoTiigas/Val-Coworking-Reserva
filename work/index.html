<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Val Coworking | Reservas</title><link rel="stylesheet" href="/styles.css"/></head><body><main class="app-shell"><header class="topbar"><a class="brand" href="/">val <span>coworking</span></a><span class="tag">Reservas online</span></header><section class="hero"><p class="eyebrow">VALPARAÍSO DE GOIÁS</p><h1>Reserve o espaço certo<br/>para o seu momento.</h1><p>Escolha o ambiente, a data e o horário.</p></section><section class="booking-grid"><section class="panel panel-lilac flow-step" data-step="espaco"><div class="panel-heading"><span>01</span><h2>Escolha o espaço</h2></div><div id="spaces" class="spaces"></div><button class="primary next-step" data-next="agenda">Continuar <span>→</span></button></section><section class="panel panel-cream flow-step" data-step="agenda"><div class="panel-heading"><span>02</span><h2>Escolha data e horário</h2></div><div class="calendar-head"><button id="prev-month">←</button><strong id="month-label"></strong><button id="next-month">→</button></div><div class="weekdays"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div id="calendar" class="calendar"></div><div id="times" class="times"></div><p id="time-help" class="muted"></p><button class="primary next-step" data-next="dados">Continuar <span>→</span></button></section><section class="panel panel-dark flow-step" data-step="dados"><div class="panel-heading"><span>03</span><h2>Seus dados</h2></div><div id="selection-summary" class="selection-summary"></div><form id="booking-form"><label>Nome completo<input required name="name"/></label><label>E-mail<input required type="email" name="email"/></label><label>Telefone<input required name="phone"/></label><button class="primary">Ir para pagamento <span>→</span></button></form><p id="form-status" class="form-status"></p></section><section class="panel panel-yellow flow-step" data-step="pagamento"><div class="panel-heading"><span>04</span><h2>Pagamento</h2></div><div id="payment-summary" class="selection-summary"></div><p class="muted">O checkout será exibido aqui assim que o meio de pagamento for definido.</p></section></section></main><script type="module" src="/app.js"></script></body></html>
