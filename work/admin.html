<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#002b27"/>
  <title>Val Coworking | Administração</title>
  <link rel="stylesheet" href="/admin.css"/>
</head>
<body>
  <main class="admin-shell">
    <section id="login-view" class="login-card" aria-labelledby="login-title">
      <img class="brand-logo" src="/images/val-coworking-logo.png" alt="Val Coworking"/>
      <p class="eyebrow">ÁREA RESTRITA</p>
      <h1 id="login-title">Painel <em>Administrativo</em></h1>
      <p class="copy">Entre para acompanhar as reservas e os pagamentos.</p>
      <form id="login-form">
        <label>E-mail<input name="email" type="email" autocomplete="email" required placeholder="voce@empresa.com"/></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"/></label>
        <p id="login-message" class="message" role="status"></p>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="dashboard-view" class="dashboard" hidden aria-labelledby="dashboard-title">
      <header class="dashboard-heading">
        <img class="brand-logo" src="/images/val-coworking-logo.png" alt="Val Coworking"/>
        <div>
          <p class="eyebrow">PAINEL ADMINISTRATIVO</p>
          <h1 id="dashboard-title">Reservas e pagamentos</h1>
          <p>Veja todas as solicitações em um único lugar.</p>
        </div>
      </header>

      <section class="stats" aria-label="Resumo de reservas">
        <article><span>Em processo</span><strong id="stat-pending">0</strong></article>
        <article><span>Pagas</span><strong id="stat-paid">0</strong></article>
        <article><span>Canceladas</span><strong id="stat-cancelled">0</strong></article>
        <article><span>Total</span><strong id="stat-total">0</strong></article>
      </section>

      <section class="panel" aria-labelledby="reservations-title">
        <div class="panel-heading">
          <p class="eyebrow">AGENDA</p>
          <h2 id="reservations-title">Reservas recentes</h2>
        </div>
        <p id="dashboard-message" class="message" role="status"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Reserva</th><th>Cliente</th><th>Espaço</th><th>Data e horário</th><th>Status</th></tr></thead>
            <tbody id="bookings-list"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="/admin.js"></script>
</body>
</html>
