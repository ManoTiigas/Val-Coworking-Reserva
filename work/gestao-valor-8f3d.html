<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Val Coworking | Operação</title><link rel="stylesheet" href="/styles.css"/></head><body><main id="login" class="admin-login"><section class="panel"><p class="eyebrow">ÁREA RESTRITA</p><h1>Operação Val</h1><form id="login-form"><label>E-mail<input required type="email" name="email"/></label><label>Senha<input required type="password" name="password"/></label><button>Entrar</button><p id="login-status" class="form-status"></p></form></section></main><main id="dashboard" class="admin-shell" hidden><header class="admin-header"><div><p class="eyebrow">PAINEL ADMINISTRATIVO</p><h1>Visão de reservas</h1></div><button id="logout" class="tag">Sair</button></header><section class="stats"><div class="stat panel-lilac"><strong id="paid-count">0</strong><small>Pagas e confirmadas</small></div><div class="stat panel-yellow"><strong id="pending-count">0</strong><small>Em processo de pagamento</small></div><div class="stat panel-cream"><strong id="all-count">0</strong><small>Reservas recentes</small></div></section><section class="reservations"><h2>Agenda</h2><table><thead><tr><th>Cliente</th><th>Espaço</th><th>Data e horário</th><th>Status</th><th>Código</th></tr></thead><tbody id="rows"></tbody></table></section></main><script type="module" src="/admin.js"></script></body></html>
